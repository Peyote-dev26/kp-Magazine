<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Author | KP MAGAZINES</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <div class="container topbar-inner">
          <div class="brand-block"><span class="brand-mark">KP</span><div><p class="eyebrow">Monthly Journal</p><h1 class="brand-name">MAGAZINES</h1></div></div>
          <nav class="main-nav"><a href="index.html">Home</a><a href="magazine.html">Magazine</a><a href="video.html">Video</a><a href="authors.html" class="active">Authors</a></nav>
          <div class="header-actions"><a href="login.html" class="btn btn-primary">Login</a></div>
        </div>
      </header>
      <main class="page-shell">
        <div class="container glass-panel" style="padding: 2rem; border-radius: 18px;">
          <p class="eyebrow accent-text">Contributor profile</p>
          <h2 id="author-name">Loading...</h2>
          <p id="author-bio"></p>
        </div>
      </main>
      <footer class="site-footer"><div class="container footer-grid"><div><div class="brand-block small-brand"><span class="brand-mark">KP</span><div><p class="eyebrow">Monthly Journal</p><h3 class="brand-name">MAGAZINES</h3></div></div></div></div></footer>
    </div>
    <script src="./js/api.js"></script>
    <script>
      (async function () {
        const id = new URLSearchParams(window.location.search).get('id');
        const author = (await apiRequest('/authors')).authors.find((item) => item.id === id);
        document.getElementById('author-name').textContent = author.name;
        document.getElementById('author-bio').textContent = author.bio;
      })();
    </script>
  </body>
</html>
