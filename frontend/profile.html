<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | KP MAGAZINES</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <div class="container topbar-inner">
          <div class="brand-block">
            <span class="brand-mark">KP</span>
            <div>
              <p class="eyebrow">Monthly Journal</p>
              <h1 class="brand-name">MAGAZINES</h1>
            </div>
          </div>
          <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="magazine.html">Magazine</a>
            <a href="video.html">Video</a>
            <a href="authors.html">Authors</a>
          </nav>
          <div class="header-actions">
            <button id="logout-button" class="btn btn-secondary">Logout</button>
          </div>
        </div>
      </header>

      <main class="page-shell">
        <div class="container glass-panel" style="padding: 2rem; border-radius: 18px;">
          <p class="eyebrow accent-text">Member profile</p>
          <h2 id="profile-name">Loading...</h2>
          <p id="profile-email"></p>
          <button class="btn btn-primary" id="load-profile">Refresh profile</button>
        </div>
      </main>
    </div>

    <script src="./js/api.js"></script>
    <script>
      async function loadProfile() {
        try {
          const data = await apiRequest('/auth/me', {
            method: 'GET',
            headers: getHeadersWithAuth(),
          });
          const user = data.user;
          if (user.role === 'reader' || user.role === 'contributor') {
            window.location.href = user.role === 'contributor' ? 'contributor.html' : 'reader.html';
            return;
          }
          document.getElementById('profile-name').textContent = `${user.firstName} ${user.lastName}`;
          document.getElementById('profile-email').textContent = user.email;
        } catch (error) {
          window.location.href = 'login.html';
        }
      }

      document.getElementById('load-profile').addEventListener('click', loadProfile);
      document.getElementById('logout-button').addEventListener('click', () => {
        clearAuthToken();
        window.location.href = 'index.html';
      });
      loadProfile();
    </script>
  </body>
</html>
