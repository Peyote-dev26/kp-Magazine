<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscribe | KP MAGAZINES</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar"><div class="container topbar-inner"><div class="brand-block"><span class="brand-mark">KP</span><div><p class="eyebrow">Monthly Journal</p><h1 class="brand-name">MAGAZINES</h1></div></div><nav class="main-nav"><a href="index.html">Home</a><a href="magazine.html">Magazine</a><a href="video.html">Video</a><a href="authors.html">Authors</a></nav><div class="header-actions"><a href="login.html" class="btn btn-primary">Login</a></div></div></header>
      <main class="page-shell">
        <div class="container auth-layout">
          <div class="auth-panel glass-panel">
            <p class="eyebrow accent-text">Membership</p>
            <h2>Subscribe to KP MAGAZINES</h2>
            <form id="subscription-form" class="form-stack">
              <label>Email<input type="email" id="member-email" required /></label>
              <label>Plan<select id="member-plan"><option>Free</option><option>Premium</option></select></label>
              <button class="btn btn-primary" type="submit">Join</button>
            </form>
          </div>
        </div>
      </main>
      <footer class="site-footer"><div class="container footer-grid"><div><div class="brand-block small-brand"><span class="brand-mark">KP</span><div><p class="eyebrow">Monthly Journal</p><h3 class="brand-name">MAGAZINES</h3></div></div></div></div></footer>
    </div>
    <script src="./js/api.js"></script>
    <script>
      document.getElementById('subscription-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          await apiRequest('/subscriptions', {
            method: 'POST',
            headers: getHeadersWithAuth(),
            body: {
              userId: 'member',
              plan: document.getElementById('member-plan').value,
              status: 'active',
              paymentStatus: 'pending',
            },
          });
          alert('Membership saved.');
        } catch (error) {
          alert(error.message);
        }
      });
    </script>
  </body>
</html>
