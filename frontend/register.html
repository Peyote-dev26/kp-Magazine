<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | KP MAGAZINES</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="site-shell auth-shell">
      <div class="container auth-layout">
        <div class="auth-panel glass-panel">
          <p class="eyebrow accent-text">Create account</p>
          <h2>Join KP MAGAZINES</h2>
          <form id="register-form" class="form-stack">
            <div class="two-col">
              <label>
                First name
                <input type="text" id="register-first-name" required />
              </label>
              <label>
                Last name
                <input type="text" id="register-last-name" required />
              </label>
            </div>
            <label>
              Email
              <input type="email" id="register-email" required />
            </label>
            <label>
              Password
              <input type="password" id="register-password" required />
            </label>
            <label>
              Account type
              <select id="register-role" required>
                <option value="reader">Reader</option>
                <option value="contributor">Contributor</option>
              </select>
            </label>
            <button type="submit" class="btn btn-primary">Create account</button>
          </form>
        </div>
      </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
