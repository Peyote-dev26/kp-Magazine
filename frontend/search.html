<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search | KP MAGAZINES</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <div class="container topbar-inner">
          <div class="brand-block"><span class="brand-mark">KP</span><div><p class="eyebrow">Monthly Journal</p><h1 class="brand-name">MAGAZINES</h1></div></div>
          <nav class="main-nav"><a href="index.html">Home</a><a href="magazine.html">Magazine</a><a href="video.html">Video</a><a href="authors.html">Authors</a><a href="about.html">About</a></nav>
          <div class="header-actions"><a href="login.html" class="btn btn-primary">Login</a></div>
        </div>
      </header>
      <main class="page-shell">
        <section class="container page-header">
          <p class="eyebrow accent-text">Search</p>
          <h2>Find stories, creators, and topics</h2>
        </section>
        <section class="container glass-panel" style="padding: 1rem; border-radius: 18px;">
          <input id="search-input" type="text" placeholder="Search KP MAGAZINES" style="width:100%;" />
        </section>
        <section class="container story-list" id="search-results" style="margin-top: 1rem;"></section>
      </main>
      <footer class="site-footer"><div class="container footer-grid"><div><div class="brand-block small-brand"><span class="brand-mark">KP</span><div><p class="eyebrow">Monthly Journal</p><h3 class="brand-name">MAGAZINES</h3></div></div></div></div></footer>
    </div>
    <script src="./js/api.js"></script>
    <script>
      const input = document.getElementById('search-input');
      const results = document.getElementById('search-results');

      async function runSearch() {
        const query = input.value.trim();
        if (!query) {
          results.innerHTML = '<p>Type a keyword to search.</p>';
          return;
        }
        const data = await apiRequest('/articles?search=' + encodeURIComponent(query));
        const list = data.articles || [];
        results.innerHTML = list.length ? list.map((article) => `<article class='story-card glass-panel'><div><p class='eyebrow accent-text'>Story</p><h4><a href='article.html?id=${article.id}'>${article.title}</a></h4><p>${article.excerpt}</p></div></article>`).join('') : '<p>No results found.</p>';
      }

      input.addEventListener('input', runSearch);
      runSearch();
    </script>
  </body>
</html>
