<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category | KP MAGAZINES</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <div class="container topbar-inner">
          <div class="brand-block"><span class="brand-mark">KP</span><div><p class="eyebrow">Monthly Journal</p><h1 class="brand-name">MAGAZINES</h1></div></div>
          <nav class="main-nav"><a href="index.html">Home</a><a href="magazine.html">Magazine</a><a href="video.html">Video</a><a href="authors.html">Authors</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
          <div class="header-actions"><a href="login.html" class="btn btn-primary">Login</a></div>
        </div>
      </header>
      <main class="page-shell">
        <section class="container page-header"><p class="eyebrow accent-text">Category</p><h2 id="category-name">Loading...</h2></section>
        <section class="container story-list" id="category-stories"></section>
      </main>
      <footer class="site-footer"><div class="container footer-grid"><div><div class="brand-block small-brand"><span class="brand-mark">KP</span><div><p class="eyebrow">Monthly Journal</p><h3 class="brand-name">MAGAZINES</h3></div></div></div></div></footer>
    </div>
    <script src="./js/api.js"></script>
    <script>
      (async function () {
        const categoryId = new URLSearchParams(window.location.search).get('id');
        const categories = await apiRequest('/categories');
        const articles = await apiRequest('/articles');
        const category = (categories.categories || []).find((item) => item.id === categoryId) || { name: 'All stories' };
        document.getElementById('category-name').textContent = category.name;
        const list = document.getElementById('category-stories');
        (articles.articles || []).filter((article) => article.categoryId === categoryId).forEach((article) => {
          const card = document.createElement('article');
          card.className = 'story-card glass-panel';
          card.innerHTML = `<img src="${article.coverImage}" alt="${article.title}" /><div><p class="eyebrow accent-text">${category.name}</p><h4><a href="article.html?id=${article.id}">${article.title}</a></h4><p>${article.excerpt}</p></div>`;
          list.appendChild(card);
        });
      })();
    </script>
  </body>
</html>
