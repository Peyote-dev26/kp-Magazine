<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | KP MAGAZINES</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="site-shell auth-shell">
      <div class="container auth-layout">
        <div class="auth-panel glass-panel">
          <p class="eyebrow accent-text">Welcome back</p>
          <h2>Login to KP MAGAZINES</h2>
          <form id="login-form" class="form-stack">
            <label>
              Email
              <input type="email" id="login-email" required />
            </label>
            <label>
              Password
              <input type="password" id="login-password" required />
            </label>
            <button type="submit" class="btn btn-primary">Sign in</button>
          </form>
          <p class="auth-link-row">
            Need an account? <a href="register.html">Register</a>
          </p>
        </div>
      </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
