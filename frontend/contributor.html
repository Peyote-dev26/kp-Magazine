<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contributor Dashboard | KP MAGAZINES</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <div class="container topbar-inner">
          <div class="brand-block"><span class="brand-mark">KP</span><div><p class="eyebrow">Monthly Journal</p><h1 class="brand-name">MAGAZINES</h1></div></div>
          <nav class="main-nav"><a href="index.html">Home</a><a href="magazine.html">Magazine</a><a href="video.html">Video</a><a href="contact.html">Contact</a></nav>
          <button id="logout-button" class="btn btn-secondary">Log out</button>
        </div>
      </header>
      <main class="page-shell">
        <div class="container">
          <section class="glass-panel" style="padding: 2rem;">
            <p class="eyebrow accent-text">Contributor dashboard</p>
            <h2>Welcome, <span id="community-name">Contributor</span></h2>
            <p id="community-email" class="muted-text"></p>
            <p>Share your voice with the KP MAGAZINES community. Your submissions will be reviewed by the editorial team.</p>
            <div class="cta-row"><a class="btn btn-primary" href="../admin/add-article.html">Submit an article</a><a class="btn btn-secondary" href="magazine.html">View published stories</a></div>
            <p class="eyebrow" style="margin-top: 1.5rem;">Account type: <span id="community-role">contributor</span></p>
          </section>
        </div>
      </main>
    </div>
    <script src="./js/api.js"></script>
    <script src="./js/community.js"></script>
    <script>loadCommunityDashboard('contributor');</script>
  </body>
</html>
