<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Detail | KP MAGAZINES</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <div class="container topbar-inner">
          <div class="brand-block"><span class="brand-mark">KP</span><div><p class="eyebrow">Monthly Journal</p><h1 class="brand-name">MAGAZINES</h1></div></div>
          <nav class="main-nav"><a href="index.html">Home</a><a href="magazine.html">Magazine</a><a href="video.html" class="active">Video</a><a href="authors.html">Authors</a></nav>
          <div class="header-actions"><a href="login.html" class="btn btn-primary">Login</a></div>
        </div>
      </header>
      <main class="page-shell container">
        <div class="glass-panel" style="padding: 2rem; border-radius: 18px;">
          <p class="eyebrow accent-text" id="video-category">Video</p>
          <h2 id="video-title">Loading...</h2>
          <div style="margin-top: 1rem;">
            <iframe width="100%" height="500" id="video-embed" src="" title="Video player" frameborder="0" allowfullscreen></iframe>
          </div>
        </div>
      </main>
      <footer class="site-footer"><div class="container footer-grid"><div><div class="brand-block small-brand"><span class="brand-mark">KP</span><div><p class="eyebrow">Monthly Journal</p><h3 class="brand-name">MAGAZINES</h3></div></div></div></div></footer>
    </div>
    <script src="./js/api.js"></script>
    <script>
      (async function () {
        const id = new URLSearchParams(window.location.search).get('id');
        const video = (await apiRequest('/videos')).videos.find((item) => item.id === id);
        const embed = document.getElementById('video-embed');
        const url = video.videoUrl.includes('youtube.com') ? video.videoUrl.replace('watch?v=', 'embed/') : video.videoUrl;
        document.getElementById('video-title').textContent = video.title;
        document.getElementById('video-category').textContent = video.category;
        embed.src = url;
      })();
    </script>
  </body>
</html>
