<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Articles | KP MAGAZINES Admin</title>
    <link rel="stylesheet" href="../frontend/css/style.css" />
    <link rel="stylesheet" href="../frontend/css/responsive.css" />
    <style>
      body { background: #07111d; }
      .admin-shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
      .admin-sidebar { background: rgba(9, 16, 26, 0.95); border-right: 1px solid rgba(143, 173, 255, 0.18); padding: 1.4rem 1rem; }
      .nav-link { display: block; padding: 0.75rem 0.8rem; border-radius: 10px; color: var(--muted); margin-bottom: 0.35rem; }
      .nav-link.active, .nav-link:hover { background: rgba(95, 124, 255, 0.16); color: var(--text); }
      .admin-main { padding: 2rem; }
      .story-list { display: grid; gap: 1rem; }
      .story-card { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 1rem; padding: 1rem; }
      .story-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; }
      .story-meta { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; margin-top: 1rem; }
      @media (max-width: 980px) { .admin-shell { grid-template-columns: 1fr; } .admin-sidebar { border-right: 0; border-bottom: 1px solid var(--line); } }
      @media (max-width: 560px) { .story-card { grid-template-columns: 1fr; } .admin-main { padding: 1rem; } }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="sidebar-brand">
          <div class="brand-block">
            <span class="brand-mark">KP</span>
            <div>
              <p class="eyebrow">Monthly Journal</p>
              <h3 class="brand-name">MAGAZINES</h3>
            </div>
          </div>
        </div>
        <nav>
          <div class="sidebar-section">
            <p class="eyebrow accent-text">Dashboard</p>
            <a class="nav-link" href="index.html">Overview</a>
            <a class="nav-link active" href="articles.html">Articles</a>
            <a class="nav-link" href="drafts.html">Drafts</a>
            <a class="nav-link" href="categories.html">Categories</a>
            <a class="nav-link" href="authors.html">Authors</a>
            <a class="nav-link" href="videos.html">Videos</a>
          </div>
        </nav>
      </aside>
      <main class="admin-main">
        <div class="section-header">
          <div>
            <p class="eyebrow accent-text">Content</p>
            <h2>Articles</h2>
          </div>
          <a class="btn btn-primary" href="add-article.html">New article</a>
        </div>
        <div id="article-admin-list" class="story-list"></div>
      </main>
    </div>
    <script src="../frontend/js/api.js"></script>
    <script>
      (async function () {
        try {
          const token = getAuthToken();
          const data = await apiRequest('/articles', {
            method: 'GET',
            headers: token ? { Authorization: `Bearer ${token}` } : {},
          });
          const list = document.getElementById('article-admin-list');
          (data.articles || []).forEach((article) => {
            const card = document.createElement('article');
            card.className = 'story-card glass-panel';
            card.innerHTML = `
              <img src="${article.coverImage || 'https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=800&q=80'}" alt="${article.title}" />
              <div>
                <p class="eyebrow accent-text">${article.status}</p>
                <h4>${article.title}</h4>
                <p>${article.excerpt || article.subtitle || ''}</p>
                <div class="story-meta">
                  <span>${article.views || 0} views</span>
                  <a class="btn btn-secondary" href="edit-article.html?id=${article.id}">Edit</a>
                </div>
              </div>
            `;
            list.appendChild(card);
          });
        } catch (error) {
          document.getElementById('article-admin-list').innerHTML = '<p class="eyebrow accent-text">Login required</p>';
        }
      })();
    </script>
  </body>
</html>
